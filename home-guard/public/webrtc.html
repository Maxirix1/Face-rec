<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #9ca3af; font-family: system-ui, sans-serif; }
    #wrap { height: 100%; display: grid; place-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    p { padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <p id="msg">กำลังรอสตรีมจาก Raspberry Pi…</p>
  </div>
  <script>
    // Expect MediaMTX WHEP at /webrtc/cam1/whep (proxied by cloudflared or nginx later)
    const msg = document.getElementById('msg');
    const video = document.getElementById('video');
    const WHEP = `${location.protocol}//${location.host}/webrtc/cam1/whep`;

    async function start() {
      try {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
        });
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });
        pc.ontrack = (ev) => {
          video.srcObject = ev.streams[0];
          msg.style.display = 'none';
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        const res = await fetch(WHEP, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: offer.sdp,
        });
        if (!res.ok) throw new Error('no stream yet');
        const answer = await res.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answer });
      } catch (err) {
        msg.textContent = 'ยังไม่มีสตรีมสดจาก Pi (ปกติจนกว่าจะมีกล้องและเริ่มดัน RTSP/WebRTC)';
        setTimeout(start, 5000);
      }
    }
    start();
  </script>
</body>
</html>
