logLevel: info
api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# Browser playback via WHEP
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

hls: yes
hlsAddress: :8888

# Path for door camera (Ubuntu / Pi / IP cam)
paths:
  cam1:
    # publisher = ffmpeg/device pushes RTSP in
    source: publisher
    # หรือให้ MediaMTX ดึงกล้องเอง:
    # source: rtsp://USER:PASS@192.168.1.50:554/stream1
    # Anyone can read from localhost reverse-proxy; publish should stay on private network / VPN
