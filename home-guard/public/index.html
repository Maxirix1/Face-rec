<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Home Guard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <h1>Home Guard</h1>
    <p>ใส่ family token เพื่อดูแจ้งเตือนและกล้อง</p>
    <input id="token" type="password" placeholder="Family token" autocomplete="current-password" />
    <button id="enter" type="button">เข้าสู่ระบบ</button>
    <p id="gate-error" class="error" hidden></p>
  </div>

  <div id="app" class="app" hidden>
    <header>
      <div>
        <strong>Home Guard</strong>
        <span id="status" class="pill">connecting…</span>
      </div>
      <button id="logout" type="button" class="ghost">ออก</button>
    </header>

    <section class="stream-card">
      <div class="stream-head">
        <h2>กล้องสด</h2>
        <span id="live-pill" class="pill dim">รอสตรีมจาก Pi</span>
      </div>
      <div id="player" class="player">
        <iframe id="stream-frame" title="Live camera" allow="autoplay; camera; microphone"></iframe>
        <p class="hint">เมื่อ Pi ดันสตรีมมาที่ MediaMTX ภาพจะขึ้นที่นี่</p>
      </div>
    </section>

    <section class="alerts-card">
      <div class="stream-head">
        <h2>แจ้งเตือน</h2>
        <button id="refresh" type="button" class="ghost">รีเฟรช</button>
      </div>
      <ul id="alerts"></ul>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
